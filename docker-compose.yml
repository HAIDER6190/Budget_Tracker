services:
  postgres:
    container_name: postgres-Budget-Tracker
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: boss
      POSTGRES_DB: BudgetTrackerdb
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - postgres-network
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin4-BudgetTracker
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root123
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5051:80"
    networks:
      - postgres-network
    restart: unless-stopped

networks:
  postgres-network:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
